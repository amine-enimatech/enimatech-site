name: Déploiement PlanetHoster

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler
        run: npm run build

      - name: Assembler le paquet
        run: |
          rm -rf deploy deploy.tar.gz && mkdir deploy
          cp -r .next/standalone deploy/app
          cp -r .next/static deploy/app/.next/static
          if [ -d public ]; then cp -r public deploy/app/public; fi
          rm -f deploy/app/.env*
          printf 'process.chdir(__dirname + "/app");\nrequire("./app/server.js");\n' > deploy/app.js
          tar -czf deploy.tar.gz -C deploy .

      - name: Préparer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      - name: Envoyer, installer et vérifier sur PlanetHoster
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" deploy.tar.gz "$SSH_USER@$SSH_HOST:enimatech-deploy.tar.gz"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'EOF'
          set -e
          REL="$HOME/enimatech-release"
          rm -rf "$REL" && mkdir -p "$REL"
          tar -xzf "$HOME/enimatech-deploy.tar.gz" -C "$REL"
          cd "$HOME/enimatech-site"
          rm -rf app.old
          if [ -d app ]; then mv app app.old; fi
          mv "$REL/app" app
          cp "$REL/app.js" app.js
          rm -rf "$REL" app.old "$HOME/enimatech-deploy.tar.gz"
          if command -v cloudlinux-selector >/dev/null 2>&1; then
            cloudlinux-selector restart --json --interpreter nodejs --app-root enimatech-site
          else
            mkdir -p tmp && touch tmp/restart.txt
          fi
          echo "Déploiement installé. Vérification..."
          sleep 8
          CODE=$(curl -k -s -o /dev/null -m 30 -w "%{http_code}" --resolve enimatech.com:443:127.0.0.1 https://enimatech.com/)
          echo "Code HTTP depuis le serveur : $CODE"
          [ "$CODE" = "200" ]
          EOF